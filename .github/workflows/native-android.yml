name: Native Android

on:
  push:
    paths:
      - "native/**"
      - "app/supabase/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native/**"
      - "app/supabase/**"
      - ".github/workflows/native-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install Android 36 platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build and test native Android
        run: >-
          ./app/android/gradlew
          --project-dir native
          :shared:jvmTest
          :androidApp:testDebugUnitTest
          :androidApp:lintDebug
          :androidApp:assembleDebug
          --console=plain
