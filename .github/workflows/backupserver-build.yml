name: Build BackupServer

on:
  push:
    branches-ignore: [main]
    paths:
      - examples/remote-backup/reference-server-implementation/**
      - .github/workflows/backupserver-build.yml

concurrency:
  group: backupserver-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build
        working-directory: ./examples/remote-backup/reference-server-implementation/LiftLog.BackupServer
